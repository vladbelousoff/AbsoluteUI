name: Release

# Pushing to main with a new version in AbsoluteUI.toc tags it, then starts
# this workflow again on the tag, which packages and uploads it. Pushing a
# tag by hand releases that tag directly.
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # Add these repository secrets (and the project IDs in the .toc) to
      # upload to CurseForge and Wago as well.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck .

      # A tag pushed with GITHUB_TOKEN doesn't start a workflow run (and the
      # packager won't build a branch push whose commit is tagged), but a
      # workflow_dispatch does.
      - name: Tag new version
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## Version: *//p' AbsoluteUI.toc | tr -d '\r')
          if [ -z "$version" ]; then
            echo "No version in AbsoluteUI.toc" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "$version is already released."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "AbsoluteUI $version"
          git push origin "$version"
          gh workflow run release.yml --ref "$version"

      - name: Package and release
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
