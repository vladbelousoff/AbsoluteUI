name: Release

# A push to main whose AbsoluteUI.toc carries a version that has no tag yet
# tags it and releases it. Pushing a tag by hand still releases that tag.
on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # Add these repository secrets (and the project IDs in the .toc) to
      # upload to CurseForge and Wago as well.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck .

      # Tags pushed with GITHUB_TOKEN don't start another workflow run, so
      # this run packages the new tag itself.
      - name: Tag new version
        id: version
        if: github.ref_type == 'branch'
        run: |
          version=$(sed -n 's/^## Version: *//p' AbsoluteUI.toc | tr -d '\r')
          if [ -z "$version" ]; then
            echo "No version in AbsoluteUI.toc" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" -m "AbsoluteUI $version"
            git push origin "$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and release
        if: github.ref_type == 'tag' || steps.version.outputs.release == 'true'
        uses: BigWigsMods/packager@v2
